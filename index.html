<title>J1 Studio | Discord Community</title>

<!-- وسوم معاينة ديسكورد (Open Graph) -->

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#262a33 0%,#101116 48%,#08090c 100%);color:#f5f6f8;font-family:Inter,Arial,sans-serif}
.card{width:min(760px,100%);padding:clamp(22px,5vw,48px);border:1px solid #353943;border-radius:24px;background:linear-gradient(145deg,rgba(34,37,45,.94),rgba(14,15,19,.97));box-shadow:0 24px 80px #0009;text-align:center}
.eyebrow{color:#aeb4c0;text-transform:uppercase;letter-spacing:4px;font-size:12px;font-weight:700}
h1{font-size:clamp(36px,8vw,66px);line-height:1.05;margin:14px 0 12px}
p{color:#b8bdc7;margin:0 auto 26px;line-height:1.7;max-width:480px}
.banner{width:100%;height:auto;display:block;border-radius:16px;border:1px solid #454a55;margin:0 auto 28px}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
a{padding:14px 25px;border-radius:12px;text-decoration:none;font-weight:800;transition:transform .2s,opacity .2s}
a:hover{transform:translateY(-2px);opacity:.9}
.primary{background:#f5f6f8;color:#111318}
.secondary{border:1px solid #555b68;color:#f5f6f8}
footer{margin-top:28px;color:#737986;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">You are invited</div>
<h1>J1 Studio</h1>
<p>Programming, development and creative projects. Join our Discord community and be part of the studio.</p>
<img class="banner" src="https://i.postimg.cc/9XsbPKWy/strip-big.gif" alt="J1 Studio animated banner">
<div class="actions">
<a class="primary" href="https://discord.gg/5zJ9VxJGNH" target="_blank" rel="noopener">Join Discord</a>
<a class="secondary" href="https://discord.gg/5zJ9VxJGNH" target="_blank" rel="noopener">Open Invite</a>
</div>
<footer>J1 STUDIO · TURN IDEAS INTO REAL PROJECTS</footer>
</main>
</body>
</html>
